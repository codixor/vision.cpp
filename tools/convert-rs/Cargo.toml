[package]
name = "visp-convert"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Convert .safetensors weights to vision.cpp GGUF files (no Python, no PyTorch)"
publish = false

[dependencies]
half = "2.7.1"
memmap2 = "0.9.12"
safetensors = "0.8.0"

[workspace]

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
